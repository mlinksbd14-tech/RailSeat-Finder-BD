name: RailSeat 24/7 Automation & Headless Mobile Grabber

on:
  schedule:
    # 1. Runs every 15 minutes 24/7 for regular seat radar scanning
    - cron: '*/15 * * * *'
    # 2. Daily 08:00 AM BD Ticket Drop Rush (01:58 AM UTC = 07:58 AM BST)
    - cron: '58 1 * * *'

  workflow_dispatch:
    inputs:
      auto_grab:
        description: '⚡ Execute 1-Tap Headless Mobile Grab (Hold in Cart & Telegram Alert)'
        required: false
        default: false
        type: boolean
      from_station:
        description: 'Departure Station (e.g. Dhaka)'
        required: false
        default: 'Dhaka'
      to_station:
        description: 'Destination Station (e.g. Chittagong, Coxs Bazar)'
        required: false
        default: 'Chittagong'
      journey_date:
        description: 'Journey Date (YYYY-MM-DD)'
        required: false
        default: ''
      seat_class:
        description: 'Seat Class (S_CHAIR, SNIGDHA, AC_S, AC_B)'
        required: false
        default: 'S_CHAIR'
      train_name:
        description: 'Target Train Name (leave empty for any available train)'
        required: false
        default: ''
      seats_count:
        description: 'Number of Seats (1-4)'
        required: false
        default: '1'
      grab_method:
        description: 'Grab Method'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - api
          - puppeteer
      force_check:
        description: 'Force alert delivery even if seat counts have not changed'
        required: false
        default: false
        type: boolean

concurrency:
  group: railseat-automation
  cancel-in-progress: false

jobs:
  run-radar-and-alerts:
    name: 🚆 Scan Seats & Headless Grabber Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: |
          npm ci --prefer-offline --no-audit

      # ── WAY 3A: 1-Tap Mobile Headless Grabber (Triggered from GitHub Mobile or Manual Dispatch) ──
      - name: 🚀 Execute 1-Tap Headless Mobile Grabber
        if: ${{ github.event.inputs.auto_grab == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RAILWAY_SESSION_TOKEN: ${{ secrets.RAILWAY_SESSION_TOKEN }}
          RAILWAY_DEVICE_ID: ${{ secrets.RAILWAY_DEVICE_ID }}
          RAILWAY_DEVICE_KEY: ${{ secrets.RAILWAY_DEVICE_KEY }}
          RAILWAY_CFT_RESPONSE: ${{ secrets.RAILWAY_CFT_RESPONSE }}
          FROM: ${{ github.event.inputs.from_station }}
          TO: ${{ github.event.inputs.to_station }}
          DOJ: ${{ github.event.inputs.journey_date }}
          CLASS: ${{ github.event.inputs.seat_class }}
          TRAIN: ${{ github.event.inputs.train_name }}
          SEATS: ${{ github.event.inputs.seats_count }}
          METHOD: ${{ github.event.inputs.grab_method }}
        run: |
          node scripts/headless-grab-cli.js --retries 10

      # ── WAY 3B: Scheduled 08:00 AM Ticket Drop Rush Auto-Grab & 24/7 Radar Scanner ──
      - name: 🔍 Run Radar & Scheduled Rush Watcher
        if: ${{ github.event.inputs.auto_grab != 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RAILWAY_SESSION_TOKEN: ${{ secrets.RAILWAY_SESSION_TOKEN }}
          RAILWAY_DEVICE_ID: ${{ secrets.RAILWAY_DEVICE_ID }}
          RAILWAY_DEVICE_KEY: ${{ secrets.RAILWAY_DEVICE_KEY }}
          RAILWAY_CFT_RESPONSE: ${{ secrets.RAILWAY_CFT_RESPONSE }}
          FORCE_CHECK: ${{ github.event.inputs.force_check || 'false' }}
          AUTO_GRAB: 'true'
        run: |
          node scripts/runner-radar-automation.js

      - name: 💾 Commit Updated Watchlist State & Timestamps
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f data/radar_watchlist.json ]; then
            git add data/radar_watchlist.json
          fi
          if [ -f data/latest_turnstile_token.json ]; then
            git add data/latest_turnstile_token.json
          fi
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore(radar): update automated check timestamps & alert state [skip ci]"
            git push origin main
          fi
