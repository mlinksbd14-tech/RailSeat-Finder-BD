services:
  - type: web
    name: railseat-finder-bd
    env: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: RENDER
        value: "true"
      - key: DISABLE_LOCAL_BROWSER
        value: "true"
      - key: LOW_MEMORY
        value: "true"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=384"
      - key: BROWSERLESS_API_KEY
        sync: false
